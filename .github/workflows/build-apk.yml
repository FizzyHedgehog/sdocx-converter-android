name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native ARM64 & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build Rust Native JNI Libraries (.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk -t arm64-v8a --platform 26 -o ../app/src/main/jniLibs build --release
          cd ..
          echo "Native libraries built:"
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/SDOCX_Converter_Lite.apk \;
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDOCX_Converter_Lite_Android_APK
          path: dist/SDOCX_Converter_Lite.apk
          if-no-files-found: error
