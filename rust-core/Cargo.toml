[package]
name = "sdocx-jni"
version = "0.4.0"
edition = "2024"
license = "MIT"

[lib]
name = "sdocx2pdf"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = "0.21"
anyhow = "1.0"
itertools = "0.14"
lerp = "0.5"
num = "0.4"
scirs2-interpolate = "0.6.5"
ndarray = "0.17"
sdocx = { path = "./sdocx" }
kahan = "0.1.4"
gaussfilt = "0.1.3"
once_cell = "1.21.4"
thiserror = "2"
ordered-float = "5.3.0"
log = "0.4"
indicatif = "0.18"
krilla = { version = "0.8.2", features = ["pdf"] }
