[package]
name = "sdocx-jni"
version = "0.4.0"
edition = "2024"
license = "MIT"

[lib]
name = "sdocx2pdf"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = "0.21"
sdocx2pdf = { path = "./sdocx2pdf/sdocx2pdf" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
